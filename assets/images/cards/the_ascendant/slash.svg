<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A1020"/>
      <stop offset="100%" stop-color="#2A0808"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)" rx="4"/>
  <!-- Two crossing slash marks -->
  <line x1="20" y1="20" x2="80" y2="80" stroke="#E8D5A3" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="20" y2="80" stroke="#E8D5A3" stroke-width="5" stroke-linecap="round"/>
  <!-- Impact glow in center -->
  <circle cx="50" cy="50" r="10" fill="#FF6622" opacity="0.7"/>
  <circle cx="50" cy="50" r="5" fill="#FFDD88" opacity="0.9"/>
  <!-- Speed lines -->
  <line x1="8" y1="50" x2="28" y2="50" stroke="#FF4422" stroke-width="2" opacity="0.6"/>
  <line x1="72" y1="50" x2="92" y2="50" stroke="#FF4422" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="8" x2="50" y2="28" stroke="#FF4422" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="72" x2="50" y2="92" stroke="#FF4422" stroke-width="2" opacity="0.6"/>
</svg>
