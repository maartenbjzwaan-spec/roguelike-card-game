<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="100%" stop-color="#3A0A0A"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)" rx="4"/>
  <!-- Sword blade -->
  <line x1="50" y1="15" x2="50" y2="75" stroke="#E8D5A3" stroke-width="4" stroke-linecap="round"/>
  <!-- Crossguard -->
  <line x1="35" y1="55" x2="65" y2="55" stroke="#C0A060" stroke-width="5" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="50" cy="82" r="6" fill="#C0A060"/>
  <!-- Slash marks -->
  <line x1="20" y1="20" x2="40" y2="40" stroke="#FF4444" stroke-width="2" opacity="0.7"/>
  <line x1="28" y1="16" x2="48" y2="36" stroke="#FF4444" stroke-width="2" opacity="0.5"/>
</svg>
